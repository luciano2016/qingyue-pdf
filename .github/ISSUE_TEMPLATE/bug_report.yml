name: Bug 报告
description: 报告可以稳定复现的功能、显示或性能问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿上传包含隐私信息的 PDF；安全问题请使用 GitHub 私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: 轻阅PDF 版本
      placeholder: 例如 0.8.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 与显示环境
      placeholder: 例如 Windows 11 24H2，2560x1440，125% 缩放
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序列出最短复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: 文档与性能信息
      description: 可填写页数、文件大小、缩放比例、视图模式、CPU/内存数据；请勿包含敏感内容。
  - type: textarea
    id: attachments
    attributes:
      label: 截图或最小样本
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我使用的是最新发布版本。
          required: true
